openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TikTok Downloader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: download
    description: TikTok download operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /download:
    post:
      operationId: downloadVideo
      tags: [download]
      summary: Fetch TikTok video info and download links
      description: Accepts a TikTok URL and returns video metadata with HD, SD, and audio download links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadInput"
      responses:
        "200":
          description: Video info and download links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoInfo"
        "400":
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to fetch video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /history:
    get:
      operationId: getHistory
      tags: [download]
      summary: Get recent download history
      description: Returns the last 50 downloaded videos
      responses:
        "200":
          description: List of recent downloads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryItem"

  /stats:
    get:
      operationId: getStats
      tags: [download]
      summary: Get download statistics
      description: Returns total download counts by format
      responses:
        "200":
          description: Download stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DownloadInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: TikTok video URL

    VideoInfo:
      type: object
      required:
        - id
        - title
        - author
        - thumbnail
        - hdUrl
        - sdUrl
        - audioUrl
        - duration
        - likes
        - plays
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        authorAvatar:
          type: ["string", "null"]
        thumbnail:
          type: string
        hdUrl:
          type: string
        sdUrl:
          type: string
        audioUrl:
          type: string
        duration:
          type: number
        likes:
          type: number
        plays:
          type: number

    HistoryItem:
      type: object
      required:
        - id
        - url
        - title
        - author
        - thumbnail
        - downloadedAt
      properties:
        id:
          type: number
        url:
          type: string
        title:
          type: string
        author:
          type: string
        thumbnail:
          type: string
        downloadedAt:
          type: string

    StatsResponse:
      type: object
      required:
        - totalDownloads
        - totalHd
        - totalSd
        - totalAudio
        - topAuthors
      properties:
        totalDownloads:
          type: number
        totalHd:
          type: number
        totalSd:
          type: number
        totalAudio:
          type: number
        topAuthors:
          type: array
          items:
            $ref: "#/components/schemas/AuthorStat"

    AuthorStat:
      type: object
      required:
        - author
        - count
      properties:
        author:
          type: string
        count:
          type: number

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
